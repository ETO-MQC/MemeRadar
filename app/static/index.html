<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MemeRadar MVP 1.0</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#172033;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1440px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.brand h1{font-size:22px;margin:0}.muted{color:#6b7280;font-size:13px}.badge{background:#e8f0ff;color:#2458a6;padding:7px 10px;border-radius:8px;font-weight:700;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e6e9ef;border-radius:12px;padding:15px;box-shadow:0 2px 10px rgba(16,24,40,.03)}.metric .v{font-size:24px;font-weight:750;margin-top:7px}.section{margin-top:14px}.section h2{font-size:16px;margin:0 0 12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}button,input{border:1px solid #d8dde6;border-radius:8px;padding:8px 10px;background:white}button{cursor:pointer;font-weight:650}button.primary{background:#1f5da8;color:#fff;border-color:#1f5da8}button.danger{color:#b42318}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #edf0f4;white-space:nowrap}th{color:#667085;font-weight:650}.scroll{overflow:auto;max-height:430px}.score{font-weight:800}.risk-pass{color:#067647}.risk-fail{color:#b42318}.risk-warn{color:#b54708}.two{display:grid;grid-template-columns:2fr 1fr;gap:14px}.tiny{font-size:12px;color:#667085}.note{background:#fff8e8;border:1px solid #f2dfab;padding:10px 12px;border-radius:9px;font-size:13px;margin-bottom:12px}.ok{color:#067647}.neg{color:#b42318}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="top"><div class="brand"><h1>热点 Meme Radar · MVP 1.0</h1><div class="muted">开源组合思路：DEX Screener + GoPlus + Gate + CCXT/Freqtrade 生态 + 可选 X/LLM</div></div><div id="mode" class="badge">加载中</div></div>
<div class="note">默认是 <b>模拟盘</b>。热点币高波动、滑点和 Rug 风险极高；LLM 只做叙事辅助评分，不直接控制真实下单。</div>
<div class="grid"><div class="card metric"><div class="muted">模拟权益</div><div class="v" id="equity">--</div></div><div class="card metric"><div class="muted">已实现盈亏</div><div class="v" id="realized">--</div></div><div class="card metric"><div class="muted">浮动盈亏</div><div class="v" id="unrealized">--</div></div><div class="card metric"><div class="muted">当前持仓</div><div class="v" id="openpos">--</div></div></div>
<div class="section card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h2>① 新币 / 热点雷达（Solana + BSC）</h2><button class="primary" onclick="scan()">立即扫描</button></div><div class="scroll"><table><thead><tr><th>币</th><th>链</th><th>总分</th><th>安全</th><th>价格</th><th>流动性</th><th>1h量</th><th>5m买/卖</th><th>年龄</th><th>1h</th><th>叙事</th><th></th></tr></thead><tbody id="cands"></tbody></table></div></div>
<div class="two section"><div class="card"><h2>② 模拟仓位</h2><div class="scroll"><table><thead><tr><th>币</th><th>策略</th><th>投入</th><th>入场</th><th>现价</th><th>PnL</th><th>状态</th><th></th></tr></thead><tbody id="positions"></tbody></table></div></div>
<div class="card"><h2>③ 监控源</h2><div class="toolbar"><input id="gatePair" placeholder="Gate币对，如 DOGE_USDT"><button onclick="addGate()">加 Gate</button></div><div class="toolbar"><input id="xUser" placeholder="X账号，如 elonmusk"><button onclick="addX()">加 X</button></div><div class="toolbar"><input id="rssUrl" placeholder="RSS/Atom URL"><button onclick="addRss()">加 RSS</button></div><div id="watch" class="tiny"></div><hr style="border:none;border-top:1px solid #edf0f4"><h2>社交雷达</h2><div id="social" class="tiny" style="max-height:260px;overflow:auto"></div></div></div>
<div class="section card"><h2>运行日志</h2><div id="events" class="tiny" style="max-height:230px;overflow:auto"></div></div>
</div><script>
const $=id=>document.getElementById(id); const f=n=>Number(n||0); const money=n=>'$'+f(n).toFixed(4); const short=n=>f(n)>=1e6?(f(n)/1e6).toFixed(1)+'M':f(n)>=1e3?(f(n)/1e3).toFixed(1)+'K':f(n).toFixed(0);
async function api(u,opt){let r=await fetch(u,opt); if(!r.ok)throw new Error(await r.text()); return r.json()}
async function refresh(){let [s,c,p,e,so]=await Promise.all([api('/api/status'),api('/api/candidates'),api('/api/positions'),api('/api/events'),api('/api/social')]);$('mode').textContent=s.mode;$('equity').textContent=money(s.summary.equity);$('realized').textContent=money(s.summary.realized_pnl);$('unrealized').textContent=money(s.summary.unrealized_pnl);$('openpos').textContent=s.summary.open_positions;$('watch').textContent='Gate: '+(s.settings.gate_watchlist.join(', ')||'无')+'\nX: '+(s.settings.x_watchlist.join(', ')||'无');
$('cands').innerHTML=c.map(x=>`<tr><td><b>${x.symbol}</b><div class=tiny>${x.name}</div></td><td>${x.chain}</td><td class=score>${f(x.score).toFixed(1)}</td><td class=risk-${x.risk_status}>${x.risk_status}</td><td>${money(x.price_usd)}</td><td>${short(x.liquidity_usd)}</td><td>${short(x.volume_h1)}</td><td>${x.buys_m5}/${x.sells_m5}</td><td>${f(x.age_minutes).toFixed(0)}m</td><td>${f(x.change_h1).toFixed(1)}%</td><td title="${(x.narrative||'').replaceAll('"','')}">${(x.narrative||'').slice(0,30)}</td><td><button onclick="buy('${x.token_key}','${x.chain==='gate'?'dip':'collector'}')">模拟买</button></td></tr>`).join('');
$('positions').innerHTML=p.map(x=>{let pnl=f(x.realized_pnl)+(x.status==='open'?f(x.remaining_qty)*(f(x.current_price)-f(x.entry_price)):0);return `<tr><td><b>${x.symbol}</b></td><td>${x.strategy}</td><td>${money(x.stake_usdt)}</td><td>${money(x.entry_price)}</td><td>${money(x.current_price)}</td><td class=${pnl>=0?'ok':'neg'}>${money(pnl)}</td><td>${x.status}${x.principal_recovered?' · 已回本':''}</td><td>${x.status==='open'?`<button class=danger onclick="closeP(${x.id})">平仓</button>`:''}</td></tr>`}).join('');
$('events').innerHTML=e.slice(0,30).map(x=>`<div>${x.ts.slice(0,19)} · <b>${x.kind}</b> · ${x.message}</div>`).join('');$('social').innerHTML=so.slice(0,30).map(x=>`<div style="margin-bottom:9px"><b>${x.author||x.source}</b> · ${(x.text||'').slice(0,160)}</div>`).join('')||'尚未配置 X/RSS，或暂无新内容。'}
async function scan(){document.querySelector('button.primary').textContent='扫描中…';try{await api('/api/scan',{method:'POST'});await refresh()}catch(e){alert(e)}finally{document.querySelector('button.primary').textContent='立即扫描'}}
async function buy(k,strategy){let stake=prompt(strategy==='collector'?'模拟投入多少U？默认1':'模拟投入多少U？默认2',strategy==='collector'?'1':'2');if(stake===null)return;try{await api('/api/paper/buy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token_key:k,strategy,stake_usdt:Number(stake)})});refresh()}catch(e){alert(e)}}
async function closeP(id){await api('/api/paper/close',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({position_id:id})});refresh()}
async function addGate(){await api('/api/watch/gate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pair:$('gatePair').value})});refresh()}async function addX(){await api('/api/watch/x',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('xUser').value})});refresh()}async function addRss(){await api('/api/watch/rss',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('rssUrl').value})});refresh()}
refresh();setInterval(refresh,15000);
</script></body></html>
